spring.application.name=venturelens-backend
server.port=8080

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/venturelens_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Storage Directory
venturelens.upload.dir=./uploads/pitch_decks

# JWT Secret
venturelens.jwt.secret=VentureLensSecureSecretKey2026SuperStrongFintechIntelligencePlatform987654321
venturelens.jwt.expiration-ms=86400000
